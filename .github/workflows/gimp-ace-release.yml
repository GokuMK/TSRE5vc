name: GIMP ACE Exporter release

on:
  push:
    tags: ["gimp-ace-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-gimp
      - name: Build and test
        shell: msys2 {0}
        run: |
          cmake -S extra/gimp-ace -B extra/gimp-ace/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DBUILD_TESTING=ON
          cmake --build extra/gimp-ace/build --parallel 4
          ctest --test-dir extra/gimp-ace/build --output-on-failure
          pacman -Q > extra/gimp-ace/build/toolchain.txt
      - name: GIMP integration test (MSYS2 runtime)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./extra/gimp-ace/tests/smoke.ps1 -GimpRoot "$env:MSYS2_LOCATION/clang64"
      - name: Package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.Substring('gimp-ace-v'.Length)
          } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          ./extra/common/release/package.ps1 -Tool gimp-ace -Version $version -RuntimeLicenseDirectory "$env:MSYS2_LOCATION/clang64/share/licenses"
      - uses: actions/upload-artifact@v4
        with:
          name: gimp-ace-windows-x64
          path: |
            dist/gimp-ace/*.zip
            dist/gimp-ace/*.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gimp-ace-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gimp-ace-windows-x64
          path: release-assets
      - name: Publish separate tools release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#gimp-ace-v}"
          (cd release-assets && sha256sum --check *.sha256)
          args=()
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.sha256 \
            --verify-tag --latest=false --notes-from-tag \
            --title "GIMP ACE Exporter $version" "${args[@]}"
