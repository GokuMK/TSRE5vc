name: Release

on:
  push:
    tags:
      - "v*-build.*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Qt and its matching MinGW toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: windows
          target: desktop
          arch: win64_mingw
          # Shader Tools: the QRhi renderer bakes its shaders at run time.
          modules: qtwebsockets qtshadertools
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Install Vulkan headers
        shell: pwsh
        run: |
          # The QRhi renderer's Vulkan backend needs the headers at build
          # time; the GPU driver provides Vulkan itself.
          $headers = Join-Path $PWD "build-vulkan/Vulkan-Headers"
          git clone --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers.git $headers
          if ($LASTEXITCODE -ne 0) { throw "Vulkan headers could not be fetched" }
          "VULKAN_HEADERS=$headers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $gxx = (Get-Command g++.exe -ErrorAction Stop).Source

          # Sound plays through miniaudio, compiled into TSRE5vc: no audio
          # library to install or ship.
          cmake -S . -B build-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_COMPILER=$gxx" `
            "-DTSRE5_VERSION=$version" `
            "-DVulkan_INCLUDE_DIR=$env:VULKAN_HEADERS/include" `
            -DTSRE5_REQUIRE_VULKAN=ON
          if ($LASTEXITCODE -ne 0) { throw "TSRE5vc configuration failed" }

          cmake --build build-release --parallel
          if ($LASTEXITCODE -ne 0) { throw "TSRE5vc build failed" }

      - name: Prepare distribution ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $packageDir = Join-Path $PWD "dist/package"
          $archive = Join-Path $PWD "dist/TSRE5vc-$version-windows-x64.zip"
          $windeployqt = (Get-Command windeployqt.exe -ErrorAction Stop).Source

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "build-release/TSRE5vc.exe" $packageDir
          # Ship the tagged resources, never independently downloaded shaders.
          if (-not (Test-Path -LiteralPath "appdata/0.7/shaders330/StandardFog.vs")) {
            throw "Tracked appdata/0.7 is missing from the source checkout"
          }
          Copy-Item -LiteralPath "appdata" -Destination $packageDir -Recurse
          $proceduralFiles = Get-ChildItem (Join-Path $packageDir "appdata/0.7/procedural") -Force |
            Where-Object { $_.Name -ne ".gitkeep" }
          if ($proceduralFiles) { throw "Default global procedural directory must ship empty" }

          & $windeployqt `
            --release `
            --no-translations `
            --compiler-runtime `
            --dir $packageDir `
            (Join-Path $packageDir "TSRE5vc.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          # Verify the package without allowing Qt or MinGW DLLs from the build PATH.
          $buildPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            & (Join-Path $packageDir "TSRE5vc.exe") --version
            if ($LASTEXITCODE -ne 0) { throw "Packaged TSRE5vc failed its launch check" }
          }
          finally {
            $env:PATH = $buildPath
          }

          # The launch check initializes a fresh portable settings profile before
          # handling --version. Keep those first-run files out of the release so
          # every tester starts with a profile generated on their own machine.
          $generatedFiles = @("log.txt", "settings.txt", "startup-args.txt") | ForEach-Object { Join-Path $packageDir $_ }
          Remove-Item $generatedFiles -Force -ErrorAction SilentlyContinue
          $generatedProfileRoot = Join-Path $packageDir "profiles"
          if (Test-Path -LiteralPath $generatedProfileRoot) {
            Remove-Item -LiteralPath $generatedProfileRoot -Recurse -Force
          }

          Compress-Archive -Path "$packageDir\*" -DestinationPath $archive

      - name: Create draft GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem "dist/*.zip" | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $archive.FullName `
            --verify-tag `
            --draft `
            --prerelease `
            --generate-notes `
            --title "TSRE5vc $env:GITHUB_REF_NAME"
